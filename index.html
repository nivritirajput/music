<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Music School · संगीत पाठशाला</title>
<meta name="description" content="Music School by Nivriti Rajput: learn Indian (Hindustani & Carnatic) and Western music, guitar and keyboard in English and Hindi — with a playable piano, fretboard, metronome, tanpura, taal player, raga explorer and ear-training games.">
<meta name="theme-color" content="#4338ca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5ff; --card:#ffffff; --cell:#f8f9ff; --soft:#eceefe;
  --ink:#1e1b4b; --muted:#6b6f9a; --line:#e0e3fa;
  --accent:#4f46e5; --accent-d:#3730a3; --teal:#0d9488; --teal-l:#dcf5f2; --gold:#d99a00; --gold-l:#fff4d1;
  --glow1:#e3e6ff; --glow2:#d9f6f1;
  --green:#15935f; --green-l:#e1f6ec; --red:#d14343; --red-l:#fde7e7; --saffron:#f07c13; --saffron-l:#fff0e0;
  --wk:#ffffff; --wk2:#eef0fb; --bk:#23224a; --keyhl:#a5b4fc; --keyact:#fbbf24; --wood:#e9d3b0; --str:#8a7a5a;
  --shadow:0 8px 24px rgba(55,48,163,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d24; --card:#161a3d; --cell:#1b2048; --soft:#232a5c;
    --ink:#eef0ff; --muted:#a3a8d6; --line:#2e3570;
    --accent:#8b8cff; --accent-d:#b9bbff; --teal:#3dd6c3; --teal-l:#123b3a; --gold:#ffcf4d; --gold-l:#3a3018;
    --glow1:#171c52; --glow2:#0f2e33;
    --green:#4fd39b; --green-l:#133628; --red:#ff7b7b; --red-l:#3d2226; --saffron:#ffa453; --saffron-l:#3a2614;
    --wk:#e8e9f5; --wk2:#c9cbe0; --bk:#05061a; --keyhl:#818cf8; --keyact:#fbbf24; --wood:#3b2f22; --str:#cdbb93;
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d24; --card:#161a3d; --cell:#1b2048; --soft:#232a5c;
  --ink:#eef0ff; --muted:#a3a8d6; --line:#2e3570;
  --accent:#8b8cff; --accent-d:#b9bbff; --teal:#3dd6c3; --teal-l:#123b3a; --gold:#ffcf4d; --gold-l:#3a3018;
  --glow1:#171c52; --glow2:#0f2e33;
  --green:#4fd39b; --green-l:#133628; --red:#ff7b7b; --red-l:#3d2226; --saffron:#ffa453; --saffron-l:#3a2614;
  --wk:#e8e9f5; --wk2:#c9cbe0; --bk:#05061a; --keyhl:#818cf8; --keyact:#fbbf24; --wood:#3b2f22; --str:#cdbb93;
  --shadow:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito','Baloo 2',system-ui,sans-serif;color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(circle at 8% 0%,var(--glow1) 0,transparent 40%),radial-gradient(circle at 100% 25%,var(--glow2) 0,transparent 34%),var(--bg);transition:background-color .3s,color .3s}
h1,h2,h3,h4,.brand,button,select{font-family:'Baloo 2',system-ui,sans-serif}
.notes-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.notes-bg span{position:absolute;bottom:-60px;color:var(--accent);opacity:0;font-size:28px;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.12}90%{opacity:.06}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 48px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px;min-width:0}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:28px;color:#fff;
  background:conic-gradient(from 200deg,var(--accent),var(--teal),var(--gold),var(--accent));box-shadow:0 6px 16px rgba(0,0,0,.18);animation:wob 4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}}
.brand h1{font-size:1.9rem;line-height:1;color:var(--accent-d)}
.brand small{display:block;color:var(--muted);font-weight:700;font-size:.9rem;margin-top:3px}
.hctl{display:flex;gap:8px;align-items:center;flex:none}
.btn{cursor:pointer;font-weight:700;font-size:1rem;padding:7px 14px;border-radius:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .15s,background .15s;line-height:1.3;min-height:40px}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
:root[data-theme="dark"] .btn.primary{color:#0b0d24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b0d24}}
.btn.sm{font-size:.9rem;padding:4px 11px;border-radius:10px;min-height:36px}
.btn.full{width:100%;padding:11px;font-size:1.08rem;margin-top:12px}
.btn.play{border-color:var(--teal);color:var(--teal)}
.btn.play.playing{background:var(--teal);color:#fff}
.btn.donebtn{background:var(--green-l);border-color:var(--green);color:var(--green)}
.btn.okb{background:var(--green-l);border-color:var(--green)}
.seg{display:inline-flex;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;max-width:100%;flex-wrap:wrap}
.seg button{border:none;background:transparent;font-weight:700;font-size:.98rem;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink);white-space:nowrap;min-height:36px}
.seg button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0b0d24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0b0d24}}
.mainnav{display:flex;width:100%;margin-bottom:14px;background:var(--card);flex-wrap:nowrap}
.mainnav button{flex:1;font-size:1.05rem;padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.mainnav .nl2{overflow:hidden;text-overflow:ellipsis}
.subnav{display:flex;width:100%;margin-bottom:12px}
.subnav button{flex:1;font-size:.95rem}
.subnav button small{opacity:.75;font-family:Nunito;font-weight:800}
/* options */
.options{display:none;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
.options.open{display:flex;animation:fadeUp .25s ease both}
.opt{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select{font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--cell);border:2px solid var(--line);border-radius:12px;padding:8px 10px;outline:none;max-width:100%}
input[type=range]{padding:0;accent-color:var(--accent);width:100%;min-width:160px;height:32px;background:none;border:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:-4px}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow1)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:8px 0 12px}
.chk{font-weight:700;display:flex;gap:6px;align-items:center;min-height:40px}
.mut{color:var(--muted)} .small{font-size:.85rem}
/* layout */
.layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.layout>*{min-width:0}
#outline,#side{display:none}
.lgrid{display:grid;grid-template-columns:1fr;gap:0 18px}
.lgrid>*{min-width:0}
/* hero */
.hero2 .h2row{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.bigic{font-size:2.6rem;line-height:1;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card h2{font-size:1.3rem;color:var(--accent-d);line-height:1.2}
.card h3{font-size:1.08rem;margin:12px 0 6px;color:var(--accent-d)}
.card h4{font-size:1.02rem;margin:12px 0 6px}
.sub{color:var(--muted);font-weight:600;font-size:.92rem;margin:2px 0 10px}
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal),var(--gold));border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* lesson rows */
details.row{border-bottom:1px dashed var(--line)}
details.row>summary{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;list-style:none}
details.row>summary::-webkit-details-marker{display:none}
details.row[open]{grid-column:1/-1}
.orb{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:1.1rem;color:#fff;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.45),transparent 42%),linear-gradient(135deg,var(--accent),var(--teal));box-shadow:0 0 0 4px var(--soft)}
.orb.ok{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.5),transparent 42%),linear-gradient(135deg,var(--green),var(--teal))}
.ri{flex:1;min-width:0;line-height:1.25}
.ri small{display:block;font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ri b{display:block;font-family:'Baloo 2';font-size:1.1rem}
.ri em{display:block;font-style:normal;font-size:.85rem;color:var(--muted);font-weight:600}
.chev{color:var(--muted);font-size:1.5rem;transition:transform .2s;flex:none}
details.row[open]>summary .chev{transform:rotate(90deg)}
.rb{padding:2px 0 16px 56px;font-size:.98rem;animation:fadeUp .25s ease both}
.rb p{margin:6px 0}
.hl{background:var(--soft);border-radius:12px;padding:8px 12px}
.expl ul,.expl ol,.steps,.tips,.mist{padding-left:22px;margin:6px 0}
.expl li,.steps li,.tips li,.mist li{margin:3px 0}
.steps li::marker{color:var(--accent);font-weight:800}
.tips li::marker{content:'💡 '} .mist li::marker{content:'⚠️ '}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.two>*{min-width:0}
.exbox{background:var(--gold-l);border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;margin-top:10px}
.callout{background:var(--teal-l);border-left:5px solid var(--teal);border-radius:12px;padding:10px 12px;margin:10px 0}
.listen{margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.82rem;font-family:Nunito}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kbd{display:inline-block;border:2px solid var(--line);border-bottom-width:4px;border-radius:7px;padding:0 6px;font-weight:800;font-size:.9em;background:var(--cell)}
/* figures */
.fig{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--cell);min-width:0}
.scrollx{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%;padding-bottom:4px}
.scrollx svg{display:block;max-width:none;height:auto}
.cap{font-size:.86rem;color:var(--muted);font-weight:600;margin-top:6px}
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.76rem;text-transform:uppercase}
pre.tab{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:.88rem;line-height:1.35;overflow-x:auto;background:var(--card);border-radius:10px;padding:10px;border:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.94rem;margin:8px 0}
.kv dt{font-weight:800;color:var(--muted)} .kv dd{min-width:0}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.igrid .btn{text-align:left}
/* sargam */
.sargam{font-family:'Baloo 2',sans-serif;font-size:1.25rem;font-weight:700;letter-spacing:.02em;line-height:2.2;word-spacing:.15em}
.sargam.sm{font-size:1.05rem;line-height:2}
.sw{display:inline-block;position:relative;padding:0 1px}
.sw.k{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.sw.t::before{content:'';position:absolute;left:50%;top:-.25em;height:.35em;width:2px;background:currentColor;transform:translateX(-50%)}
.sw.md::after,.sw.tr::after{content:'';position:absolute;left:50%;width:5px;height:5px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.sw.md::after{bottom:-.25em} .sw.tr::after{top:-.32em}
.sw.t.tr::after{top:-.6em}
.swbar{color:var(--muted);margin:0 .2em}
/* svg styles */
svg text{font-family:'Nunito','Baloo 2',sans-serif;fill:var(--ink)}
.piano .wk{fill:var(--wk);stroke:#9aa0c8;stroke-width:1;cursor:pointer}
.piano .bk{fill:var(--bk);stroke:#000;cursor:pointer}
.piano .wk.hl{fill:var(--keyhl)} .piano .bk.hl{fill:#6366f1}
.piano .act{fill:var(--keyact)!important}
.piano .kl{fill:#3b3f6b;font-weight:800;pointer-events:none} .piano .kl.on{fill:#1e1b4b}
.piano .bkl,.piano text.bkl{fill:#fff;pointer-events:none}
.piano .swt{fill:#1e1b4b;font-weight:800;pointer-events:none} .piano .swl{stroke:#1e1b4b;stroke-width:1.5} .piano .swd{fill:#1e1b4b}
.piano .swt.bkl{fill:#fff}
.piano .kk{fill:#9aa0c8;font-size:10px;font-weight:800;pointer-events:none}
.piano .fn{fill:var(--accent);font-weight:800;font-size:13px}
.piano text,.piano line,.piano circle{pointer-events:none}
.staff .sl{stroke:var(--ink);stroke-width:1;opacity:.75} .staff .ink,.staff circle{fill:var(--ink)} .staff .hollow{fill:none;stroke:var(--ink);stroke-width:1.6}
.staff .stem{stroke:var(--ink);stroke-width:1.4;fill:none} .staff .tie{fill:none;stroke:var(--ink);stroke-width:1.3}
.staff .clef path,.staff .clef{stroke:var(--ink);fill:none} .staff .clef circle{fill:var(--ink)}
.staff .acc{fill:var(--ink);font-family:'Segoe UI Symbol','Noto Sans Symbols 2',serif}
.staff .tsg{font-family:Georgia,serif;font-weight:900;font-size:20px}
.staff .nl{font-size:11px;font-weight:800;fill:var(--accent)}
.cbox .gs,.cbox .gf{stroke:var(--ink);stroke-width:1;opacity:.8} .cbox .nut,.fret .nut{stroke:var(--ink);stroke-width:5}
.cbox .dot{fill:var(--accent)} .cbox .dfn{fill:#fff;font-size:9px;font-weight:800} .cbox .open{fill:none;stroke:var(--ink);stroke-width:1.5}
.cbox .ox{font-size:13px;font-weight:800} .cbox .cname{font-family:'Baloo 2';font-size:15px;font-weight:800;fill:var(--accent-d)} .cbox .bfr{font-size:10px;font-weight:800}
.cbox .snames{font-size:8.5px;fill:var(--muted);letter-spacing:4.5px}
.cboxes{display:flex;flex-wrap:wrap;gap:8px}
.cboxes.small svg{width:90px}
.cbtn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;cursor:pointer;transition:transform .15s}
.cbtn:hover{transform:translateY(-2px);border-color:var(--accent)}
.fret .fwood{fill:var(--wood)} .fret .gf{stroke:#b9b3a6;stroke-width:2} .fret .gstr{stroke:var(--str)} .fret .inlay{fill:#fff;opacity:.6}
.fret .frn{font-size:10px;font-weight:800;fill:var(--muted)}
.fret .fm circle{fill:var(--accent);stroke:#fff;stroke-width:1.5} .fret .fm text{fill:#fff;font-size:10px;font-weight:800;pointer-events:none}
.fret .fm.root circle{fill:var(--saffron)} .fret .fm.tapped circle{fill:var(--gold)} .fret .fm .swl{stroke:#fff} .fret .fm .swd{fill:#fff} .fret .fm .swt{fill:#fff;font-weight:800}
.fret .fhit{fill:transparent;cursor:pointer} .fret .fhit:hover{fill:rgba(79,70,229,.15)} .fret .fm{pointer-events:none}
.taal .tring{fill:none;stroke:var(--line);stroke-width:3} .taal .tm circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.taal .tm.v1 circle{stroke:var(--teal)} .taal .tm text{font-weight:800}
.taal .tm.sam circle{fill:var(--saffron-l);stroke:var(--saffron);stroke-width:3} .taal .tm.khali circle{stroke-dasharray:4 3}
.taal .tm.now circle{fill:var(--gold);stroke:var(--gold)} .taal .tnum{font-size:9px;fill:var(--muted);font-weight:800}
.taal .tmark{font-weight:900;font-size:15px} .taal .tmark.sam{fill:var(--saffron)} .taal .tmark.khali{fill:var(--teal)} .taal .tcen{font-family:'Baloo 2';font-size:22px;font-weight:800;fill:var(--muted)}
.taalrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.taalrow>*{min-width:0}
.bolt td{text-align:center;font-weight:700;border:1px solid var(--line)} .bolt td small{color:var(--muted)} .bolt td.now{background:var(--gold-l)}
.tind{font-family:'Baloo 2';font-size:1.6rem;font-weight:800;min-height:2.4rem}
.tind.sam{color:var(--saffron)} .tind.khali{color:var(--teal)} .tind.tali{color:var(--accent)}
.cof .cofo{fill:var(--soft);stroke:var(--card);stroke-width:2;cursor:pointer} .cof .cofi{fill:var(--teal-l);stroke:var(--card);stroke-width:2;cursor:pointer}
.cof .cofk:hover .cofo,.cof .cofk.on .cofo{fill:var(--accent)} .cof .cofk.on .cofi{fill:var(--teal)}
.cof .cofk.on text{fill:#fff} .cof text{pointer-events:none} .cof .cofM{font-family:'Baloo 2';font-weight:800;font-size:16px} .cof .cofN{font-size:9px;fill:var(--muted);font-weight:800} .cof .cofm{font-size:11px;font-weight:700}
.cof .cofc{fill:var(--card)} .cof .cofct{font-family:'Baloo 2';font-weight:800;font-size:13px;fill:var(--accent-d)}
.cofwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.cofwrap>*{min-width:0} .cofsvg svg{max-width:100%;height:auto}
.ill .it{font-weight:700} .ill .it.b{font-weight:900} .ill .it.mut{fill:var(--muted)} .ill .it.dyn{font-family:Georgia,serif;font-style:italic;font-weight:900}
.ill .wv{fill:none;stroke:var(--accent);stroke-width:2.5} .ill .wv2{fill:none;stroke:var(--teal);stroke-width:2.5} .ill .hp{fill:none;stroke:var(--ink);stroke-width:2}
.ill .palm{fill:var(--gold-l);stroke:var(--gold);stroke-width:1.5} .ill .fnum{font-weight:900;fill:var(--accent-d);font-size:12px}
.ill .gbody{fill:#d7a86e;stroke:#8a5a2b;stroke-width:2} .ill .ghole{fill:#3b2414} .ill .gbridge{fill:#5b3a1f} .ill .gneck{fill:#7a5230} .ill .ghead{fill:#5b3a1f} .ill .gpeg{fill:#ccc;stroke:#777}
.ill .gstr{stroke:#eee} .ill .gf{stroke:#ccc;stroke-width:1.2} .ill .nut{stroke:#f5f5f5;stroke-width:3}
.ill .sapt{stroke-width:2;fill:var(--card)} .ill .s0{stroke:var(--teal)} .ill .s1{stroke:var(--accent)} .ill .s2{stroke:var(--saffron)}
.ill .swl{stroke:var(--ink);stroke-width:1.5} .ill .swd{fill:var(--ink)} .ill .swt{font-weight:800}
.ill .adiC{fill:var(--accent);opacity:.85} .ill .adiF{fill:var(--teal);opacity:.6} .ill .hwk{fill:#fff;stroke:#999} .ill .hbk{fill:#222}
.nvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .nvrow b{min-width:150px}
/* tools */
.pianobox{border-radius:14px}
.readout{font-weight:700;min-height:1.6em;margin:8px 0}
.metrobig{display:flex;gap:18px;align-items:center;margin:8px 0}
.pulse{width:72px;height:72px;border-radius:50%;background:var(--soft);border:4px solid var(--accent);flex:none}
.metrobig.sm .pulse{width:40px;height:40px}

const SW_SEMI = { S: 0, r: 1, R: 2, g: 3, G: 4, m: 5, M: 6, P: 7, d: 8, D: 9, n: 10, N: 11 };
/** parse sargam text. Tokens separated by spaces/commas-free; ",N" or ".N" = mandra, "S'" = taar, "-" = hold/rest.
*  Returns [{semi, oct, rest}] where semi is semitones from madhya Sa. */
function parseSargam(str) {
const out = [];
String(str).trim().split(/\s+/).forEach(tok => {
if (!tok) return;
if (tok === '-' || tok === 'ऽ') { out.push({ rest: true }); return; }
if (tok === '|' || tok === '||') { out.push({ bar: true }); return; }
const m = /^([,.]*)([SrRgGmMPdDnN])('*)$/.exec(tok);
if (!m) { out.push({ bad: tok }); return; }
const oct = m[3].length - m[1].length;
out.push({ semi: SW_SEMI[m[2]] + 12 * oct, oct, l: m[2] });
});
return out;
}

/** pitch set (semitones 0..11) a raga uses, from aroha+avaroha */
function ragaSet(id) {
const r = RAGAS[id]; const s = new Set();
parseSargam(r.ar + ' ' + r.av).forEach(x => { if (x.semi != null) s.add(pcMod(x.semi)); });
return [...s].sort((a, c) => a - c);
}
function thaatSet(id) { return parseSargam(THAATS[id].s).map(x => x.semi); }

const ev = [];
if (s.n) {
const d = s.d || 0.5, vs = s.v ? String(s.v).split(/\s+/).map(Number) : null; let tt = 0, k = 0;

tt += len;

parseSargam(s.sg).forEach(x => {

if (x.rest) { if (last) last.dur += d; tt += d; return; }

});
} else if (s.ch) {

String(s.ch).trim().split(/\s+/).forEach((sym, ci) => {
const t0 = ci * beats * beat; const ns = gtr ? guitarMidis(sym) : chordNotes(sym, 55); const c = parseChord(sym); const bass = c ? 36 + pcMod(c.root - 36) + (pcMod(c.root) < 4 ? 12 : 0) : null;
if (!ns.length) return;

const inst = gtr ? 'guitar' : (s.i || 'piano');
if (style === 'block') { ev.push({ t: t0, notes: ns, dur: beats * beat * 0.95, inst, vel: 0.6 }); if (!gtr && bass) ev.push({ t: t0, notes: [bass], dur: beats * beat * 0.95, inst, vel: 0.6 }); return; }
const lh = chordNotes(sym, 48).slice(0, 3);
if (style === 'alberti') { const ord = [0, 2, 1, 2]; for (let i = 0; i < beats * 2; i++) ev.push({ t: t0 + i * beat / 2, notes: [lh[ord[i % 4]]], dur: beat / 2 * 0.9, inst, vel: i % 4 === 0 ? 0.7 : 0.5 }); return; }
if (style === 'broken') { const ord = [0, 1, 2, 1]; for (let i = 0; i < beats; i++) ev.push({ t: t0 + i * beat, notes: [lh[ord[i % 4]]], dur: beat * 0.95, inst, vel: 0.6 }); return; }
if (style === 'arp') { const arp = lh.concat([lh[0] + 12, lh[2] + 12 > lh[0] + 12 ? lh[1] + 12 : lh[1]]); for (let i = 0; i < beats * 2; i++) ev.push({ t: t0 + i * beat / 2, notes: [arp[i % arp.length]], dur: beat * 0.9, inst, vel: 0.55 }); return; }
if (style === 'waltz') { ev.push({ t: t0, notes: [bass], dur: beat, inst, vel: 0.7 }); for (let i = 1; i < beats; i++) ev.push({ t: t0 + i * beat, notes: ns, dur: beat * 0.7, inst, vel: 0.45 }); return; }
ev.push({ t: t0, notes: ns, dur: beats * beat * 0.95, inst, vel: 0.6 });
});
} else if (s.scale) {

const seq = ns.concat(ns.slice(0, -1).reverse()); seq.forEach((m, i) => ev.push({ t: i * d, notes: [m], dur: d * 0.95, inst: s.i || 'piano' }));
} else if (s.raga) {

} else if (s.thaat) {

ev.push({ t: cycles * n * beat, bol: bols[0], len: beat, dur: beat, cb: host ? () => hiliteTaal(host, 0) : null });

} else if (s.rhythm) {

} else if (s.strum) {
const bpm = s.bpm || 80, beat = 60 / bpm, pat = String(s.strum).trim().split(/\s+/), bars = s.bars || 2; const chords = String(s.c || 'G').split(/\s+/);
for (let b2 = 0; b2 < bars; b2++) { const ns = guitarMidis(chords[b2 % chords.length]); pat.forEach((p, i) => { const tt = (b2 * pat.length + i) * beat / 2; if (p === 'D' || p === 'U') ev.push(...strumEvents(ns, tt, p, beat * 1.2, i === 0 ? 0.9 : 0.7)); if (i % 2 === 0) ev.push({ t: tt, click: 'sub', dur: 0.05 }); ev.push({ t: tt, dur: 0.01, cb: host ? () => hiliteSlot(host, i) : null }); }); }
} else if (s.pick) {
const bpm = s.bpm || 80, beat = 60 / bpm, pat = String(s.pick).trim().split(/\s+/), bars = s.bars || 2; const chords = String(s.c || 'C').split(/\s+/);
for (let b2 = 0; b2 < bars; b2++) {
const g = guitarChord(chords[b2 % chords.length]); const fr = g.frets; const low = fr.findIndex(x => x != null);
const strIdx = { P: low, I: 3, M: 4, A: 5 };
const reps = Math.max(1, Math.round(8 / pat.length));
for (let r = 0; r < reps; r++) pat.forEach((p, i) => { const k = r * pat.length + i; const tt = (b2 * pat.length * reps + k) * beat / 2; const si = strIdx[p[0]]; if (si == null) return; const f = fr[si] == null ? 0 : fr[si]; ev.push({ t: tt, notes: [TUNING[si] + f], dur: beat * 1.4, inst: 'guitar', vel: p[0] === 'P' ? 0.9 : 0.7 }); ev.push({ t: tt, dur: 0.01, cb: host ? () => hiliteSlot(host, i) : null }); });
}
} else if (s.tune != null) {
const m = TUNING[6 - s.tune]; for (let i = 0; i < 3; i++) ev.push({ t: i * 1.6, notes: [m], dur: 1.5, inst: 'guitar', vel: 0.9 });
} else if (s.staff) { return staffEvents(s.staff);
} else if (s.notes) { s.notes.forEach((m, i) => ev.push({ t: i * (s.d || 0.4), notes: [m], dur: (s.d || 0.4) * 0.95, inst: s.i || 'piano' })); }
return ev;
}
function hiliteTaal(host, i) { host.querySelectorAll('.tm').forEach(g => g.classList.toggle('now', +g.dataset.i === i)); }
function hiliteSlot(host, i) { host.querySelectorAll('[data-slot]').forEach(g => g.classList.toggle('now', +g.dataset.slot === i)); }
let PLAYING = null;
function playSpec(s, btn, host) {
if (PLAYING && PLAYING === btn) { stopSeq(); setPlayBtn(btn, false); PLAYING = null; return; }
if (PLAYING) setPlayBtn(PLAYING, false);
const evs = specEvents(s, host); if (!evs.length) return;
PLAYING = btn; setPlayBtn(btn, true);
playEvents(evs, { done: () => { if (PLAYING === btn) { setPlayBtn(btn, false); PLAYING = null; } if (host) { host.querySelectorAll('.now').forEach(x => x.classList.remove('now')); } } });
if (s.taal) use('taal'); if (s.raga) use('ragaPlay'); markDay();

/* staff playback: convert staff tokens into note events (quarter = 0.5s at 120 bpm) */

function sideHTML() {
const sa = saMidi();
return `<div class="card side-card"><h3>🎹 ${S.lang === 'hi' ? 'छोटा कीबोर्ड' : 'Mini keyboard'}</h3><div class="scrollx">${pianoSVG({ from: 60, to: 72, lab: S.names === 'sargam' ? 'sargam' : 'name', names: S.names, sa, lang: S.lang, cls: 'live' })}</div><p class="readout small" id="sideRead">${S.lang === 'hi' ? 'कंप्यूटर कीबोर्ड: A S D F G H J K' : 'Computer keys: A S D F G H J K'}</p></div>
<div class="card side-card"><h3>⏱️ ${t('tMetro').replace(/^\S+\s/, '')}</h3><div class="metrobig sm"><div class="pulse"></div><div class="bpmnum">${MT.bpm} <small>BPM</small></div></div>
<div class="chips"><button class="btn sm" data-act="bpm:-5">−5</button><button class="btn sm" data-act="bpm:5">+5</button><button class="btn sm primary" data-loop="metro">${METRO.on ? t('stop') : t('start')}</button></div></div>
<div class="card side-card"><h3>🪕 ${t('tTanpura').replace(/^\S+\s/, '')}</h3><p class="mut small">${t('pitchOf', { n: pretty(SA_NAMES[S.sa]) })}</p><button class="btn sm primary" data-loop="tanpura">${TANP.on ? t('stop') : t('start')}</button></div>
<div class="card side-card"><p class="mut small">${t('sargamKey')}</p></div>`;
}
function render(keepOpen) {
const openIds = keepOpen ? $$('details.lrow[open]').map(d => d.dataset.lid) : []; const y = window.scrollY;
document.documentElement.lang = S.lang === 'hi' ? 'hi' : 'en'; document.title = t('appName') + ' · ' + (S.lang === 'hi' ? 'Music School' : 'संगीत पाठशाला');
PLAYS.length = 0; PLAYING = null;
$('#appName').textContent = t('appName'); $('#tagline').textContent = t('tagline'); $('#langBtn').textContent = t('langBtn'); $('#optBtn').setAttribute('aria-label', t('options'));
$('#options').innerHTML = optionsHTML(); $('#mainNav').innerHTML = navHTML();
$('#outline').innerHTML = outlineHTML();
$('#app').innerHTML = S.tab === 'tools' ? toolsView() : courseView(S.tab);
$('#side').innerHTML = sideHTML(); $('#footNote').textContent = t('footNote'); $('#stopAll').textContent = t('stopAll');
$('body').classList.toggle('in-tools', S.tab === 'tools');
openIds.forEach(id => { const d = document.getElementById('L-' + id); if (d) { fillLesson(d); d.open = true; } });
if (keepOpen) window.scrollTo(0, y);
refreshLoopBtns();
}
function fillLesson(d) { const body = d.querySelector('.lbody'); if (body && !body.innerHTML) { const l = LESSONS.find(x => x.id === d.dataset.lid); body.innerHTML = lessonBody(l); } }
function openLesson(id) {
const l = LESSONS.find(x => x.id === id); if (!l) return; S.tab = l.course; S.lvl[l.course] = l.lvl; save(); render();
const d = document.getElementById('L-' + id); if (d) { fillLesson(d); d.open = true; setTimeout(() => d.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }), 30); }
}
function cofInfo(host, i) {
const k = COF_MAJ[i], mi = COF_MIN[i], ks = keySig(k); const lang = S.lang;
host.querySelector('.cofsvg').innerHTML = cofSVG(i, lang);
const accs = ks.acc.map(a => pretty(a + (ks.n > 0 ? '#' : 'b'))).join(' ');
const dia = diatonicChords(k);
host.querySelector('.cofinfo').innerHTML = `<h4>${pretty(k)} ${lang === 'hi' ? 'मेजर' : 'major'} · ${pretty(mi.slice(0, -1))} ${lang === 'hi' ? 'माइनर' : 'minor'}</h4>
<p>${ks.n === 0 ? (lang === 'hi' ? 'कोई ♯ या ♭ नहीं' : 'No sharps or flats') : Math.abs(ks.n) + (ks.n > 0 ? ' ♯: ' : ' ♭: ') + accs}</p>
<p><b>${lang === 'hi' ? 'स्केल' : 'Scale'}:</b> ${spellScale(k, 'major').map(pretty).join(' ')}</p>
<p><b>${lang === 'hi' ? 'कॉर्ड' : 'Chords'}:</b> ${dia.map(c => `${c.rn} ${pretty(c.sym)}`).join(' · ')}</p>
<div class="chips">${playBtn({ scale: k + ' major' }, (lang === 'hi' ? 'स्केल' : 'Scale'))}${playBtn({ ch: `${dia[0].sym} ${dia[3].sym} ${dia[4].sym} ${dia[0].sym}`, beats: 2, bpm: 100 }, 'I – IV – V – I')}</div>`;
if (staffSVG) host.querySelector('.cofinfo').insertAdjacentHTML('beforeend', `<div class="scrollx">${staffSVG({ clef: 'treble', key: k, m: 'r/w ||' })}</div>`);
}
/* =================== EVENTS =================== */
function onClick(e) {
const el = e.target.closest('button, [data-k], rect[data-m], .fhit, g.fm, [data-raga]'); if (!el) return;
const d = el.dataset;
if (el.id === 'langBtn') { S.lang = S.lang === 'en' ? 'hi' : 'en'; save(); render(true); return; }
if (el.id === 'optBtn') { const o = $('#options'); const open = !o.classList.contains('open'); o.classList.toggle('open', open); el.setAttribute('aria-expanded', open); return; }
if (el.id === 'stopAll') { stopAll(); return; }
if (d.opt) { const [k, v] = d.opt.split(':'); S[k] = v; if (k === 'theme') applyTheme(); save(); render(true); return; }
if (d.tab) { S.tab = d.tab; save(); render(); window.scrollTo(0, 0); return; }
if (d.lvl != null) { S.lvl[S.tab] = +d.lvl; save(); render(); return; }
if (d.tool) { S.tab = 'tools'; S.tool = d.tool; save(); render(); if (innerWidth < 1100) $('#app').scrollIntoView({ block: 'start' }); return; }
if (d.goto) { S.tab = 'tools'; S.tool = d.goto; save(); render(); window.scrollTo(0, 0); return; }
if (d.jump) { openLesson(d.jump); return; }
if (d.play != null) { const host = el.closest('.fig, .card'); playSpec(PLAYS[+d.play], el, host); refreshLoopBtns(); return; }
if (d.done) { const id = d.done; if (S.done[id]) { delete S.done[id]; toast(t('undoToast')); } else { S.done[id] = today(); toast(t('doneToast')); } markDay(); save(); render(true); return; }
if (d.chord) { const c = d.chord; playSpec({ strum: 'D', c, bpm: 60, bars: 1 }, null); if (S.tab === 'tools' && S.tool === 'guitar') { GT.show = 'chord'; GT.chord = GCH[c] ? c : GT.chord; GT.last = null; renderTool(); } return; }
if (d.loop) { toggleLoop(d.loop); return; }
if (d.raga) { RG.id = d.raga; renderTool(); return; }
if (d.game) { GM.g = d.game; newQ(); renderTool(); return; }
if (d.ans != null) { answer(d.ans); return; }
if (d.seg) { const [k, v] = d.seg.split(':'); segSet(k, v); return; }
if (d.k != null && el.closest('[data-cof]')) { cofInfo(el.closest('[data-cof]'), +d.k); return; }
if (el.matches('rect[data-m]') && el.closest('svg.piano')) { return; } // handled on pointerdown
if (d.act) { act(d.act, el); return; }
}
function segSet(k, v) {
if (k === 'names') { S.names = v; save(); render(true); return; }
if (k === 'fkind') { FD.kind = v; renderTool(); return; }
if (k === 'glvl') { GM.lvl = v; newQ(); renderGame(); return; }
if (k === 'gmode') { GM.mode = v; newQ(); renderGame(); return; }
if (k === 'gclef') { GM.clef = v; newQ(); renderGame(); return; }
}
function act(a, el) {
const [k, v] = a.split(':');
if (k === 'octDn') { S.oct = Math.max(2, S.oct - 1); save(); renderTool(); }
else if (k === 'octUp') { S.oct = Math.min(6, S.oct + 1); save(); renderTool(); }
else if (k === 'bpm') { MT.bpm = Math.max(30, Math.min(240, MT.bpm + +v)); updMetro(); }
else if (k === 'bpmset') { MT.bpm = +v; updMetro(); }
else if (k === 'tap') tapTempo();
else if (k === 'laya') { TL.bpm = +v; renderTool(); }
else if (k === 'reset') { if (confirm(t('resetAsk'))) { S.done = {}; S.days = []; S.scores = {}; S.used = {}; S.badges = []; save(); toast(t('resetDone')); render(); } }
else if (k === 'gplay') playQ();
else if (k === 'gnext') { newQ(); renderGame(); if (GM.g !== 'staff' && GM.g !== 'rhythm') setTimeout(playQ, 150); }
else if (k === 'rlisten') rhythmRun(true);
else if (k === 'rstart') rhythmRun(false);
else if (k === 'rtap') rhythmTap();
}
function updMetro() { if (S.tab === 'tools' && S.tool === 'metro') renderTool(); $('#side').innerHTML = sideHTML(); refreshLoopBtns(); }
function onChange(e) {
const el = e.target; const k = el.dataset.set; if (!k) return; const v = el.type === 'checkbox' ? el.checked : el.value;
const live = e.type === 'input';
switch (k) {
case 'vol': S.vol = +v; setVolume(S.vol); save(); return;
case 'sa': if (live) return; S.sa = +v; save(); render(true); return;
case 'inst': if (live) return; S.inst = v; save(); return;
case 'showKeys': S.showKeys = v; save(); renderTool(); return;
case 'pthl': PT.hl = v; break; case 'ptroot': PT.root = v; break; case 'pttype': PT.type = v; break; case 'ptchord': PT.chord = v; break; case 'ptraga': PT.raga = v; break;
case 'gshow': GT.show = v; GT.last = null; break; case 'groot': GT.root = v; break; case 'gtype': GT.type = v; break; case 'gchord': GT.chord = v; break;
case 'gpat': GT.pat = v; break; case 'gprog': GT.prog = v; break;
case 'gbpm': GT.bpm = +v; if (live) { const b2 = el.closest('.field').querySelector('label b'); if (b2) b2.textContent = v; return; } return;
case 'mbpm': MT.bpm = +v; if (live) { $$('.bpmnum').forEach(n => n.innerHTML = MT.bpm + ' <small>BPM</small>'); return; } updMetro(); return;
case 'mbeats': MT.beats = +v; break; case 'msub': MT.sub = +v; break; case 'maccent': MT.accent = v; break;
case 'tstr': TP.str = v; break; case 'tcycle': TP.cycle = 8.8 - +v; return;
case 'taal': TL.id = v; TL.bpm = TAALS[v].bpm; if (TAALP.on) { TAALP.stop(); TAALP.start(); } break;
case 'tbpm': TL.bpm = +v; if (live) { const b2 = el.closest('.field').querySelector('label b'); if (b2) b2.textContent = v; return; } return;
case 'froot': FD.root = v; break; case 'ftype': FD.type = v; break; case 'fq': FD.q = v; break;
default: return;
}
if (live && el.type === 'range') return;
renderTool();
}
/* piano & fretboard pointer play */
let PDOWN = false;
function onPointerDown(e) {
const k = e.target.closest('svg.piano rect[data-m]');
if (k) { PDOWN = true; const m = +k.dataset.m; playKey(m); markDay(); return; }
const f = e.target.closest('svg.fret [data-s][data-f]');
if (f) { const s = +f.dataset.s, fr = +f.dataset.f; const m = TUNING[s] + fr; playKey(m, 'guitar'); if (S.tab === 'tools' && S.tool === 'guitar') { GT.last = { s, f: fr }; renderTool(); noteReadout(m, `${t('string')} ${6 - s}, ${t('fret')} ${fr}`); } markDay(); }
}
function onPointerOver(e) { if (!PDOWN || e.pointerType !== 'mouse' || !(e.buttons & 1)) return; const k = e.target.closest('svg.piano rect[data-m]'); if (k) playKey(+k.dataset.m); }
const HELD = new Set();
function onKey(e) {
if (e.ctrlKey || e.metaKey || e.altKey) return; const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
if (e.key === ' ' && S.tab === 'tools' && S.tool === 'games' && GM.g === 'rhythm') { e.preventDefault(); if (!e.repeat) rhythmTap(); return; }
const key = e.key.toLowerCase();
if (key === 'z' || key === 'x') { S.oct = Math.max(2, Math.min(6, S.oct + (key === 'z' ? -1 : 1))); save(); if (S.tab === 'tools' && S.tool === 'piano') renderTool(); toast(t('octave') + ' ' + S.oct); return; }
const i = KEYMAP.indexOf(key); if (i < 0 || e.repeat || HELD.has(key)) return; HELD.add(key);
if (!$('svg.piano.live')) return;
playKey(12 * (S.oct + 1) + i); markDay();
}
/* =================== INIT =================== */
function init() {
load(); applyTheme(); setVolume(S.vol);
if (!TOOLS.includes(S.tool)) S.tool = 'piano'; if (!['west', 'indian', 'guitar', 'keys', 'tools'].includes(S.tab)) S.tab = 'west';
render(); checkBadges(); BADGE_READY = true;
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { const bg = $('#notesBg'); const g = ['♪', '♫', '♩', '♬', 'सा', 'प', '♯', '♭']; for (let i = 0; i < 14; i++) { const sp = document.createElement('span'); sp.textContent = g[i % g.length]; sp.style.left = (Math.random() * 100) + '%'; sp.style.fontSize = (18 + Math.random() * 22) + 'px'; sp.style.animationDuration = (16 + Math.random() * 18) + 's'; sp.style.animationDelay = (-Math.random() * 30) + 's'; bg.appendChild(sp); } }
document.addEventListener('click', onClick);
document.addEventListener('change', onChange); document.addEventListener('input', onChange);
document.addEventListener('pointerdown', onPointerDown); document.addEventListener('pointerup', () => PDOWN = false); document.addEventListener('pointerover', onPointerOver);
document.addEventListener('keydown', onKey); document.addEventListener('keyup', e => HELD.delete(e.key.toLowerCase()));
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.lrow') && d.open) fillLesson(d); }, true);
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
}
if (typeof document !== 'undefined') { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init(); }
</script>
</body>
